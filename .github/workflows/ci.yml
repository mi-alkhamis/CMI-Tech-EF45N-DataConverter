name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest-cov pytest

      - name: Lint with Ruff
        run: ruff check main.py

      - name: Run tests
        run: pytest tests/ -v --cov=main --cov-report=term-missing --cov-fail-under=45

